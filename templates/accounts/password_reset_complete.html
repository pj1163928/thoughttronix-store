{% extends "base.html" %}

{% block title %}Password reset — The ThoughtTronix Store{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <div class="card bg-base-100 shadow-md">
      <div class="card-body">
        <h1 class="card-title text-2xl">Your password has been reset</h1>
        <p class="text-sm">
          Every device that was signed in to your account has been signed
          out. Sign in with your new password to carry on.
        </p>
        <div class="card-actions mt-2 justify-end">
          <a href="{{ login_url }}" class="btn btn-primary btn-sm">Sign in</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
