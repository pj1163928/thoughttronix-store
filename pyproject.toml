[project]
name = "thoughttronix"
version = "0.1.0"
description = "The ThoughtTronix Store — Your Thoughts, Our Business."
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<6.1",
    "django-tailwind-cli==4.6.2",
    "environs>=15.0.1",
    "pillow>=12.3.0",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
extend-select = ["I", "DJ", "UP", "B"]
